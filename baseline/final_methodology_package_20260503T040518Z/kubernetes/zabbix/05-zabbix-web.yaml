apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  namespace: monitoring
  labels:
    app: zabbix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
      - name: zabbix-web
        image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_SERVER_HOST
          value: zabbix-postgres
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: zabbix-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zabbix-postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: zabbix-postgres-secret
              key: POSTGRES_DB
        - name: ZBX_SERVER_HOST
          value: zabbix-server
        - name: PHP_TZ
          value: UTC
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  namespace: monitoring
  labels:
    app: zabbix-web
  annotations:
    metallb.io/loadBalancerIPs: 10.10.0.160
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.160
  selector:
    app: zabbix-web
  ports:
  - name: http
    port: 80
    targetPort: 8080
