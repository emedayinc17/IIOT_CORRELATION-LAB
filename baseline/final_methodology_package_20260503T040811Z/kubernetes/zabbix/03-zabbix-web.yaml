apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
      - name: zabbix-web
        image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
        env:
        - name: DB_SERVER_HOST
          value: zabbix-postgres
        - name: POSTGRES_USER
          value: zabbix
        - name: POSTGRES_PASSWORD
          value: zabbixpass
        - name: POSTGRES_DB
          value: zabbix
        - name: ZBX_SERVER_HOST
          value: zabbix-server
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  namespace: monitoring
  annotations:
    metallb.io/loadBalancerIPs: 10.10.0.160
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.160
  selector:
    app: zabbix-web
  ports:
  - port: 80
    targetPort: 8080
