- apiVersion: v1
  data:
    methodology.md: |
      Scenario C uses a Wazuh single-node/all-in-one laboratory deployment.
      The decision prioritizes reproducibility, experimental control, deterministic freezes,
      and reduced operational variables.

      The laboratory does not evaluate Kubernetes hardening, high availability,
      Wazuh clustering, SIEM sizing, or runtime security. Kubernetes is used only as
      the reproducible substrate for deploying the IIoT, Zabbix, and Wazuh layers.

      The scientific focus is the correlation between operational observability
      from Zabbix and security observability from Wazuh under IIoT/MITRE ATT&CK
      for ICS scenarios.
