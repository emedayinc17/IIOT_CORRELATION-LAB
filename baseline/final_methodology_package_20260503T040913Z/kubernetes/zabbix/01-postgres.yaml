apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-postgres
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-postgres
  template:
    metadata:
      labels:
        app: zabbix-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_USER
          value: zabbix
        - name: POSTGRES_PASSWORD
          value: zabbixpass
        - name: POSTGRES_DB
          value: zabbix
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-postgres
  namespace: monitoring
spec:
  selector:
    app: zabbix-postgres
  ports:
  - port: 5432
    targetPort: 5432
