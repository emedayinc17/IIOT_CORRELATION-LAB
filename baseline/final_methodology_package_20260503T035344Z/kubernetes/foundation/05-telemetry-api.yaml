apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-api-code
  namespace: iiot-poc
data:
  app.py: |

    from http.server import BaseHTTPRequestHandler, HTTPServer
    from datetime import datetime, timezone
    import json, socket, random
    SERVICE_NAME = "telemetry-api"
    class Handler(BaseHTTPRequestHandler):
        def _json(self, obj, code=200):
            body=json.dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type","application/json"); self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
        def do_GET(self):
            now=datetime.now(timezone.utc).isoformat()
            if self.path.startswith("/health") or self.path.startswith("/ready"):
                self._json({"status":"ok","service":SERVICE_NAME,"timestamp":now,"host":socket.gethostname()})
            elif self.path.startswith("/telemetry"):
                self._json({"timestamp":now,"site":"mine-site-01","equipment":"crusher-01","temperature_c":round(random.uniform(35,72),2),"vibration_mm_s":round(random.uniform(.2,5),3),"pressure_bar":round(random.uniform(1,6.5),2),"status":"normal"})
            elif self.path.startswith("/metrics"):
                body=f"iiot_{SERVICE_NAME.replace('-','_')}_up 1\n".encode()
                self.send_response(200); self.send_header("Content-Type","text/plain"); self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
            else:
                self._json({"status":"not_found","service":SERVICE_NAME,"timestamp":now},404)
        def do_POST(self):
            now=datetime.now(timezone.utc).isoformat()
            length=int(self.headers.get("Content-Length","0") or 0)
            raw=self.rfile.read(length).decode() if length else "{}"
            try: payload=json.loads(raw)
            except Exception: payload={"raw":raw}
            self._json({"status":"accepted","service":SERVICE_NAME,"payload":payload,"timestamp":now})
        def log_message(self, fmt, *args):
            print("%s - - [%s] %s"%(self.client_address[0],self.log_date_time_string(),fmt%args), flush=True)
    HTTPServer(("0.0.0.0",8080), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: iiot-poc
  labels:
    app: telemetry-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-api
  template:
    metadata:
      labels:
        app: telemetry-api
    spec:
      containers:
      - name: telemetry-api
        image: python:3.11-slim
        command: ["python", "/app/app.py"]
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: telemetry-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: iiot-poc
spec:
  type: ClusterIP
  selector:
    app: telemetry-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api-lb
  namespace: iiot-poc
  annotations:
    metallb.io/loadBalancerIPs: 10.10.0.153
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.153
  selector:
    app: telemetry-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
