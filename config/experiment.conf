# Configuración experimental centralizada | Centralized experimental configuration

# Nombre lógico del experimento para trazabilidad | Logical experiment name for traceability
EXPERIMENT_NAME="iiot-zabbix-wazuh-correlation"

# Versión metodológica usada para el artículo corregido | Methodological version used for the revised paper
EXPERIMENT_VERSION="paper-final"

# Perfil experimental A-E usado en la reorganización metodológica | A-E experimental profile used in the methodological reorganization
EXPERIMENT_PROFILE="A-E-methodology"

# Zona horaria estándar para normalizar timestamps | Standard timezone for timestamp normalization
TIMEZONE_STANDARD="UTC"

# Directorio donde se almacenan datasets, tablas y figuras | Directory where datasets, tables, and figures are stored
RESULTS_DIR="results"

# Directorio donde se almacenan evidencias técnicas exportadas | Directory where exported technical evidence is stored
EVIDENCE_DIR="evidence"

# Directorio donde se almacenan freezes y paquetes metodológicos | Directory where freezes and methodology packages are stored
BASELINE_DIR="baseline"

# Directorio donde se mantiene documentación técnica detallada | Directory where detailed technical documentation is maintained
DOCS_DIR="docs"

# Directorio donde se mantienen manifiestos Kubernetes | Directory where Kubernetes manifests are maintained
KUBERNETES_DIR="kubernetes"

# Directorio donde se mantienen scripts del laboratorio | Directory where laboratory scripts are maintained
SCRIPTS_DIR="scripts"

# Namespace para servicios IIoT simulados | Namespace for simulated IIoT services
IIOT_NAMESPACE="iiot-poc"

# Namespace para Zabbix y monitoreo operacional | Namespace for Zabbix and operational monitoring
MONITORING_NAMESPACE="monitoring"

# Namespace para Wazuh y monitoreo de seguridad | Namespace for Wazuh and security monitoring
SECURITY_NAMESPACE="security"

# Namespace reservado para automatización experimental | Namespace reserved for experimental automation
EXPERIMENTS_NAMESPACE="experiments"

# Escenarios funcionales de validación de infraestructura e instrumentación | Functional scenarios for infrastructure and instrumentation validation
FUNCTIONAL_SCENARIOS="A B C"

# Escenarios cuantitativos usados para resultados del paper | Quantitative scenarios used for paper results
QUANTITATIVE_SCENARIOS="D E"

# Técnicas MITRE ATT&CK for ICS evaluadas en el escenario D | MITRE ATT&CK for ICS techniques evaluated in scenario D
MITRE_TECHNIQUES="T0809 T0814 T0860"

# Número de corridas por técnica MITRE en escenario D | Number of runs per MITRE technique in scenario D
RUNS_PER_TECHNIQUE=20

# Perfiles de ruido operacional legítimo evaluados en escenario E | Legitimate operational noise profiles evaluated in scenario E
NOISE_PROFILES="LOW MEDIUM HIGH"

# Número de corridas por perfil de ruido operacional en escenario E | Number of runs per operational noise profile in scenario E
RUNS_PER_NOISE_PROFILE=20

# Duración de fase basal previa por corrida para observar estado normal | Previous baseline phase duration per run to observe normal state
BASELINE_SECONDS=120

# Duración activa del ataque o evento experimental por corrida | Active attack or experimental event duration per run
ATTACK_ACTIVE_SECONDS=30

# Duración de recuperación posterior para observar estabilidad y cierre del evento | Post-event recovery duration to observe stability and event closure
RECOVERY_SECONDS=120

# Ventana temporal para considerar una correlación Wazuh-Zabbix válida | Time window to consider a valid Wazuh-Zabbix correlation
CORRELATION_WINDOW_SECONDS=120

# Frecuencia esperada de muestreo operacional desde Zabbix | Expected operational sampling frequency from Zabbix
ZABBIX_POLLING_SECONDS=5

# Lookback usado para consultar eventos Wazuh cercanos a la ejecución | Lookback used to query Wazuh events close to execution
WAZUH_LOOKBACK_SECONDS=120

# Número de solicitudes para carga HTTP DoS controlada T0860 | Number of requests for controlled HTTP DoS load T0860
DOS_REQUESTS=500

# Concurrencia usada para carga HTTP DoS controlada T0860 | Concurrency used for controlled HTTP DoS load T0860
DOS_CONCURRENCY=30

# Timeout de ejecución HTTP DoS controlada T0860 | Timeout for controlled HTTP DoS execution T0860
DOS_TIMEOUT_SECONDS=30

# Número de mensajes MQTT para simulación de telemetría o comando | Number of MQTT messages for telemetry or command simulation
MQTT_MESSAGES=100

# Pausa entre mensajes MQTT para controlar ritmo de telemetría | Sleep between MQTT messages to control telemetry rate
MQTT_SLEEP_SECONDS=1

# Endpoint de disponibilidad del servicio health-app | Availability endpoint for health-app service
HEALTH_APP_URL="http://10.10.0.152:8080/health"

# Endpoint de salud de telemetry-api | Health endpoint for telemetry-api
TELEMETRY_API_HEALTH_URL="http://10.10.0.153:8080/health"

# Endpoint de métricas de telemetry-api | Metrics endpoint for telemetry-api
TELEMETRY_API_METRICS_URL="http://10.10.0.153:8080/metrics"

# Endpoint de envío o consulta de telemetría | Telemetry send or query endpoint
TELEMETRY_API_URL="http://10.10.0.153:8080/telemetry"

# Endpoint de disponibilidad de aplicación vulnerable controlada | Availability endpoint for controlled vulnerable application
VULNERABLE_APP_URL="http://10.10.0.154:8080/health"

# Tabla de detección de ataques MITRE | MITRE attack detection table
ATTACK_DETECTION_TABLE="results/tables/table_attack_detection.csv"

# Tabla de resumen de correlación temporal | Temporal correlation summary table
TEMPORAL_CORRELATION_TABLE="results/tables/table_temporal_correlation_summary.csv"

# Tabla de estimación MTTD o delta de detección | MTTD or detection delta estimation table
MTTD_TABLE="results/tables/table_mttd_estimation.csv"

# Tabla de intervalos bootstrap IC95 | Bootstrap CI95 intervals table
BOOTSTRAP_CI_TABLE="results/tables/table_bootstrap_ci.csv"

# Tabla de falsos positivos bajo ruido operacional | False-positive table under operational noise
NOISE_FPR_TABLE="results/tables/table_noise_fpr_summary.csv"

# Tabla de intervalo Wilson IC95 para FPR | Wilson CI95 interval table for FPR
NOISE_WILSON_TABLE="results/tables/table_noise_wilson_ci.csv"

# Tabla de readiness metodológico A-E | A-E methodological readiness table
SCENARIO_READINESS_TABLE="results/tables/table_scenario_readiness.csv"

# Controla si el wrapper A ejecuta reset antes del despliegue; false evita acciones destructivas accidentales | Controls whether wrapper A runs reset before deployment; false avoids accidental destructive actions
RESET_BEFORE_SCENARIO_A="false"

# Si es true, cada wrapper valida readiness al finalizar | If true, each wrapper validates readiness at completion
VALIDATE_AFTER_SCENARIO="true"

# Si es true, la campaña completa genera freeze final al terminar | If true, the full campaign generates final freeze at completion
AUTO_FREEZE_AFTER_RUN="true"

# Si es true, se muestra resumen final al terminar | If true, a final summary is shown at completion
SHOW_FINAL_SUMMARY="true"

# Si es true, los scripts de orquestación detienen ejecución ante errores críticos | If true, orchestration scripts stop execution on critical errors
STOP_ON_ERROR="true"
